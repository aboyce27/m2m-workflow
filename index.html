<title>M2M Process Workflow Chart - V3</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0F172A;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* ── Top bar ── */
  #toolbar {
    background: #1E293B;
    border-bottom: 1px solid #334155;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 18px;
    gap: 12px;
    flex-shrink: 0;
    z-index: 10;
  }

  #toolbar-left {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  #toolbar-title {
    color: #F1F5F9;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 0.02em;
  }

  #toolbar-sub {
    color: #64748B;
    font-size: 11px;
  }

  #toolbar-controls {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn {
    background: #334155;
    border: 1px solid #475569;
    color: #CBD5E1;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }

  .btn:hover {
    background: #475569;
    color: #F1F5F9;
  }

  .btn.primary {
    background: #1D4ED8;
    border-color: #2563EB;
    color: white;
  }

  .btn.primary:hover {
    background: #2563EB;
  }

  .btn-icon {
    font-size: 16px;
    padding: 5px 11px;
  }

  #zoom-display {
    color: #94A3B8;
    font-size: 12px;
    min-width: 46px;
    text-align: center;
  }

  .divider {
    width: 1px;
    height: 22px;
    background: #334155;
    margin: 0 4px;
  }

  /* ── Hint bar ── */
  #hint-bar {
    background: #0F172A;
    border-bottom: 1px solid #1E293B;
    padding: 5px 18px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-shrink: 0;
  }

  .hint {
    color: #475569;
    font-size: 10.5px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .hint kbd {
    background: #1E293B;
    border: 1px solid #334155;
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 10px;
    color: #64748B;
  }

  /* ── Canvas ── */
  #canvas {
    flex: 1;
    overflow: hidden;
    position: relative;
    cursor: grab;
  }

  #canvas.grabbing {
    cursor: grabbing;
  }

  #diagram-wrap {
    position: absolute;
    top: 0; left: 0;
    transform-origin: 0 0;
    will-change: transform;
  }

  #diagram-wrap svg {
    display: block;
    /* crisp rendering at all zoom levels */
    shape-rendering: geometricPrecision;
    text-rendering: geometricPrecision;
  }

  /* ── Mini legend strip at bottom ── */
  #status-bar {
    background: #1E293B;
    border-top: 1px solid #334155;
    padding: 5px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  #status-bar span {
    color: #475569;
    font-size: 10px;
  }

  #status-bar strong {
    color: #64748B;
  }
</style>
</head>

<div id="status-bar">
  <span>M2M Phase 2 BRD · Andrew Boyce · May 2026 · <strong>INTERNAL USE ONLY</strong></span>
  <span>SVG vector · infinitely scalable · no quality loss</span>
</div>

<script>
  // ── State ──
  const SVG_W = 1120, SVG_H = 1238;
  const MIN_ZOOM = 0.15, MAX_ZOOM = 8;

  let scale = 1, panX = 0, panY = 0;
  let dragging = false, lastX = 0, lastY = 0;

  const canvas  = document.getElementById('canvas');
  const wrap    = document.getElementById('diagram-wrap');
  const zoomLbl = document.getElementById('zoom-display');

  // Row y-coordinates for the ⚠ jump buttons [top of each row]
  const ROW_Y = [112, 220, 354, 470, 580, 724, 864, 974];

  function applyTransform() {
    wrap.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    zoomLbl.textContent = Math.round(scale * 100) + '%';
  }

  function clampPan() {
    // Soft clamping — allow a little bleed off edges
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    const dw = SVG_W * scale, dh = SVG_H * scale;
    const bleed = 80;
    panX = Math.min(cw - bleed, Math.max(-(dw - bleed), panX));
    panY = Math.min(ch - bleed, Math.max(-(dh - bleed), panY));
  }

  function fitDiagram() {
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    const padding = 32;
    scale = Math.min((cw - padding * 2) / SVG_W, (ch - padding * 2) / SVG_H);
    panX = (cw - SVG_W * scale) / 2;
    panY = (ch - SVG_H * scale) / 2;
    applyTransform();
  }

  function resetView() {
    scale = 1;
    panX = 0; panY = 0;
    applyTransform();
  }

  function zoomBy(delta, originX, originY) {
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    const ox = originX ?? cw / 2;
    const oy = originY ?? ch / 2;

    const newScale = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, scale + delta));
    const ratio = newScale / scale;

    panX = ox - ratio * (ox - panX);
    panY = oy - ratio * (oy - panY);
    scale = newScale;

    clampPan();
    applyTransform();
  }

  function zoomToRow(rowIndex) {
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    const rowY = ROW_Y[rowIndex] ?? 0;
    const targetScale = 2.2;
    scale = targetScale;
    panX = (cw / 2) - (SVG_W / 2) * scale;
    panY = (ch / 2) - (rowY + 60) * scale;
    clampPan();
    applyTransform();
  }

  // ── Mouse wheel zoom ──
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const ox = e.clientX - rect.left;
    const oy = e.clientY - rect.top;
    const delta = e.deltaY < 0 ? 0.15 : -0.15;
    zoomBy(delta, ox, oy);
  }, { passive: false });

  // ── Drag to pan ──
  canvas.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    dragging = true;
    lastX = e.clientX; lastY = e.clientY;
    canvas.classList.add('grabbing');
  });

  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    panX += e.clientX - lastX;
    panY += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    clampPan();
    applyTransform();
  });

  window.addEventListener('mouseup', () => {
    dragging = false;
    canvas.classList.remove('grabbing');
  });

  // ── Double-click to zoom in centered on click point ──
  canvas.addEventListener('dblclick', e => {
    const rect = canvas.getBoundingClientRect();
    zoomBy(0.5, e.clientX - rect.left, e.clientY - rect.top);
  });

  // ── Touch support ──
  let lastTouchDist = null;

  canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      dragging = true;
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
    }
    if (e.touches.length === 2) {
      dragging = false;
      lastTouchDist = Math.hypot(
        e.touches[1].clientX - e.touches[0].clientX,
        e.touches[1].clientY - e.touches[0].clientY
      );
    }
  }, { passive: true });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1 && dragging) {
      panX += e.touches[0].clientX - lastX;
      panY += e.touches[0].clientY - lastY;
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
      clampPan();
      applyTransform();
    }
    if (e.touches.length === 2 && lastTouchDist !== null) {
      const dist = Math.hypot(
        e.touches[1].clientX - e.touches[0].clientX,
        e.touches[1].clientY - e.touches[0].clientY
      );
      const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      const rect = canvas.getBoundingClientRect();
      zoomBy((dist - lastTouchDist) * 0.01, cx - rect.left, cy - rect.top);
      lastTouchDist = dist;
    }
  }, { passive: false });

  canvas.addEventListener('touchend', () => {
    dragging = false;
    lastTouchDist = null;
  });

  // ── Init: fit on load ──
  window.addEventListener('load', fitDiagram);
  window.addEventListener('resize', fitDiagram);
</script>
